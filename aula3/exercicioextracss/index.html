<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Escolher cores</title>
</head>
<body>
    <h2>Monte sua mensagem inspiradora</h2>

    <form action="mensagem.php" method="get">
        <label>Cor do texto</label><br>
        <select name="cor_texto">
            <option value="black">Preto</option>
            <option value="white">Branco</option>
            <option value="blue">Azul</option>
            <option value="darkgreen">Verde escuro</option>
            <option value="purple">Roxo</option>
        </select>
        <br><br>

        <label>Cor do fundo:</label><br>
        <select name="cor_fundo">
            <option value="#fffae6">Amarelo </option>
            <option value="#e6f2ff">Azul</option>
            <option value="#ffe6f0">Rosa</option>
            <option value="#222222">Escuro</option>
            <option value="#e6ffe6">Verde</option>
        </select>
        <br>

        <input type="submit" value="Ver Mensagem">
    </form>
</body>
</html>
