<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apuração dos Votos - Brasil</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Apuração por Estado</h1>

    <div class="map-container">
        <!-- Div da Tooltip (Apuração) -->
        <div id="tooltip" class="tooltip">
            <h3 id="nome-estado">Estado</h3>
            <p><strong>Candidato A:</strong> <span id="votos-a">0%</span></p>
            <p><strong>Candidato B:</strong> <span id="votos-b">0%</span></p>
            <p class="total"><strong>Total de Votos:</strong> <span id="total-votos">0</span></p>
        </div>

        <!-- Mapa SVG do Brasil com os IDs/data-uf correspondentes -->
        <svg viewBox="0 0 600 600" width="100%" height="100%">
            <g id="estados">
                <path id="AC" data-uf="AC" d="M 50,220 L 90,220 L 80,250 L 40,240 Z" />
                <path id="AM" data-uf="AM" d="M 60,110 L 170,110 L 160,200 L 50,210 Z" />
                <path id="RR" data-uf="RR" d="M 130,40 L 180,40 L 175,100 L 125,100 Z" />
                <path id="PA" data-uf="PA" d="M 180,100 L 310,100 L 290,220 L 170,200 Z" />
                <path id="AP" data-uf="AP" d="M 260,40 L 310,40 L 300,90 L 255,85 Z" />

                <path id="TO" data-uf="TO" d="M 295,210 L 340,210 L 330,310 L 285,290 Z" />
                <path id="MA" data-uf="MA" d="M 320,105 L 380,115 L 365,210 L 300,200 Z" />
                <path id="PI" data-uf="PI" d="M 370,130 L 410,140 L 390,240 L 350,210 Z" />
                <path id="CE" data-uf="CE" d="M 415,125 L 460,135 L 445,175 L 405,160 Z" />
                <path id="RN" data-uf="RN" d="M 465,140 L 500,150 L 490,170 L 450,165 Z" />

            </g>
        </svg>
    </div>

    <script src="script.js"></script>
</body>
</html>
